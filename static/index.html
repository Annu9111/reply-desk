<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reply Desk</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { margin-bottom: 0.2rem; }
    .sub { color: #666; margin-top: 0; }
    textarea { width: 100%; box-sizing: border-box; padding: 0.6rem; font: inherit; }
    button { padding: 0.5rem 1rem; margin: 0.4rem 0.4rem 0 0; font: inherit; cursor: pointer; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 0.8rem 1rem; margin: 0.8rem 0; }
    .tag { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 12px; font-size: 0.8rem; background: #eee; }
    .proposed { background: #fff3cd; } .done { background: #d4edda; }
    .rejected, .held { background: #f8d7da; }
    .muted { color: #666; font-size: 0.9rem; }
    #error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Reply Desk</h1>
  <p class="sub">An AI drafts a reply, a reviewer scores it, and a person approves it. Demo mode: no real email is sent.</p>

  <textarea id="message" rows="3" placeholder="Paste a customer message, e.g. Where is my order A100?"></textarea>
  <button id="submit">Draft a reply</button>
  <p id="error"></p>

  <h2>Drafts</h2>
  <div id="drafts"></div>

  <h2>Sent replies</h2>
  <div id="sent"></div>

  <script>
    const el = (tag, text, cls) => {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (cls) node.className = cls;
      return node;
    };

    async function api(path, options) {
      const res = await fetch(path, options);
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Something went wrong");
      return data;
    }

    function post(path, body) {
      return api(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    }

    function showError(err) {
      document.getElementById("error").textContent = err ? err.message : "";
    }

    function renderDraft(d) {
      const card = el("div", undefined, "card");
      card.appendChild(el("div", "Customer: " + d.message, "muted"));
      card.appendChild(el("p", d.draft));

      const status = el("span", d.status, "tag " + (d.status === "held for a person" ? "held" : d.status));
      card.appendChild(status);

      if (d.scores) {
        const text = Object.entries(d.scores).map(([k, v]) => k + " " + v).join(" · ");
        card.appendChild(el("div", "Reviewer scores: " + text, "muted"));
      }
      if (d.reason) card.appendChild(el("div", "Held because: " + d.reason, "muted"));

      if (d.status === "proposed") {
        const approve = el("button", "Approve and send");
        approve.onclick = async () => {
          try {
            await post("/drafts/" + d.id + "/approve", { by: "reviewer", seen_hash: d.hash });
            showError(null);
          } catch (err) { showError(err); }
          refresh();
        };
        const reject = el("button", "Reject");
        reject.onclick = async () => {
          const reason = prompt("Why are you rejecting this draft?");
          if (!reason) return;
          try {
            await post("/drafts/" + d.id + "/reject", { by: "reviewer", reason });
            showError(null);
          } catch (err) { showError(err); }
          refresh();
        };
        card.appendChild(approve);
        card.appendChild(reject);
      }
      return card;
    }

    async function refresh() {
      const drafts = await api("/drafts");
      const draftsBox = document.getElementById("drafts");
      draftsBox.replaceChildren();
      if (!drafts.length) draftsBox.appendChild(el("p", "No drafts yet.", "muted"));
      drafts.slice().reverse().forEach((d) => draftsBox.appendChild(renderDraft(d)));

      const sent = await api("/sent");
      const sentBox = document.getElementById("sent");
      sentBox.replaceChildren();
      if (!sent.length) sentBox.appendChild(el("p", "Nothing sent yet.", "muted"));
      sent.forEach((s) => sentBox.appendChild(el("div", s.reply, "card")));
    }

    document.getElementById("submit").onclick = async () => {
      const box = document.getElementById("message");
      const message = box.value.trim();
      if (!message) return;
      try {
        await post("/messages", { message });
        box.value = "";
        showError(null);
      } catch (err) { showError(err); }
      refresh();
    };

    refresh();
  </script>
</body>
</html>
